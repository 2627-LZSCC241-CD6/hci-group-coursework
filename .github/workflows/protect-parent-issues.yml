name: Protect Parent Issues
# The entirety of this file was generated by Gemini AI on gemini-3.1-pro prompted by:

on:
  issues:
    types: [closed]

permissions:
  issues: write 

jobs:
  enforce-parent-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Issue is a Sub-issue
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            const sender = payload.sender.login;
            const issue = payload.issue;

            const ADMINS = ['dummy-account'];

            if (ADMINS.includes(sender)) {
              console.log(`${sender} is an admin. Closure allowed.`);
              return;
            }

            // Query GitHub to see if this issue belongs to a parent issue
            const query = `
              query($owner: String!, $repo: String!, $issue_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue_number) {
                    parentIssue {
                      id
                    }
                    trackedInIssues(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;
            
            let isSubIssue = false;
            
            try {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              
              const issueData = result.repository.issue;
              
              // An issue is a sub-issue if it has a native parent, or is tracked in a tasklist
              const hasParent = issueData.parentIssue !== null && issueData.parentIssue !== undefined;
              const isTracked = issueData.trackedInIssues && issueData.trackedInIssues.totalCount > 0;
              
              isSubIssue = hasParent || isTracked;
              
            } catch (error) {
              console.log("GraphQL query failed. Defaulting to strict protection. Error: ", error);
              // Fail-safe: If we can't definitively prove it's a sub-issue, we block it from closing.
              isSubIssue = false; 
            }

            if (!isSubIssue) {
              // Re-open the issue because it has no parent (it is a top-level issue)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });

