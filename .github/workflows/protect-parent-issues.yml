name: Protect Parent Issues
# This file was generated by gemini-3.1-pro and edited with GitHub CoPilot

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  enforce-parent-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Issue Has Sub-issues
        uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender.login;
            const issue = context.payload.issue;
            const ADMINS = ['quack-b1'];

            if (ADMINS.includes(sender)) {
              console.log(`${sender} is an admin. Closure allowed.`);
              return;
            }

            // A parent issue is one that contains sub-issues.
            const query = `
              query($owner: String!, $repo: String!, $issue_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue_number) {
                    subIssues(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;

            let isParentIssue = false;

            try {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });

              isParentIssue =
                (result.repository?.issue?.subIssues?.totalCount ?? 0) > 0;
            } catch (error) {
              console.log(
                'GraphQL error encountered; allowing closure to avoid incorrect reopening:',
                error
              );
              return;
            }

            if (!isParentIssue) {
              console.log('This issue has no sub-issues. Closure allowed.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'open'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `@${sender} Parent issues must be reviewed and closed by a project admin. This issue has been reopened for admin review.`
            });
