name: Protect Parent Issues
# The entirety of this file was generated by Gemini AI on gemini-3.1-pro

on:
  issues:
    types: [closed]

permissions:
  issues: write 

jobs:
  enforce-parent-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Issue is a Sub-issue
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            const sender = payload.sender.login;
            const issue = payload.issue;

            const ADMINS = ['dummy-account'];

            if (ADMINS.includes(sender)) {
              console.log(`${sender} is an admin. Closure allowed.`);
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $issue_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue_number) {
                    parentIssue {
                      id
                    }
                    trackedInIssues(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;
            
            let isSubIssue = false;
            
            try {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              
              const issueData = result.repository.issue;
              
              const hasParent = issueData.parentIssue !== null && issueData.parentIssue !== undefined;
              const isTracked = issueData.trackedInIssues && issueData.trackedInIssues.totalCount > 0;
              
              isSubIssue = hasParent || isTracked;
              
            } catch (error) {
              console.log("GraphQL error: ", error);
              isSubIssue = false; 
            }

            if (!isSubIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${sender} Only project admins can close top-level issues. Please move this issue to **In Review** for sign-off.`
              });
            } else {
              console.log("This is a sub-issue. Closure allowed.");
            }
