name: Protect Parent Issues
# The entirety of this file was generated by Gemini AI on gemini-3.6-flash prompted by:
# "is it possible, on a github project board, to prevent contributers from closing parent issues and moving them to the 'Done' list? i.e, contributors should be able to close sub-issues, but never parent issues. they should move the parent issue to 'In Review' and only an admin can close it and move it to 'Done'"

on:
  issues:
    types: [closed]

jobs:
  enforce-parent-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check User Role & Issue Type
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            const sender = payload.sender.login;
            const issue = payload.issue;

            // Define your Admin handles
            const ADMINS = ['quack-b1'];

            // 1. Check if closed by non-admin
            if (ADMINS.includes(sender)) {
              console.log(`${sender} is an admin. Closure allowed.`);
              return;
            }

            // 2. Determine if it's a parent issue (e.g., checks for 'epic' or 'parent' label, or sub-task list)
            const isParent = issue.labels.some(l => l.name === 'epic' || l.name === 'parent') 
                          || issue.body.includes('- [ ]');

            if (isParent) {
              // Re-open the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });

              // Post warning comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${sender} Only project admins can close parent/epic issues. Please move this issue to **In Review** for admin sign-off.`
              });
            }
            
