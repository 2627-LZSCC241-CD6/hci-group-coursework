name: Protect Parent Issues
# The entirety of this file was generated by Gemini AI on gemini-3.1-pro

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  enforce-parent-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Issue is a Sub-issue
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            const sender = payload.sender.login;
            const issue = payload.issue;

            const ADMINS = ['quack-b1'];

            if (ADMINS.includes(sender)) {
              console.log(`${sender} is an admin. Closure allowed.`);
              return;
            }

            // GraphQL query referencing trackedInIssues (standard task list relationships)
            const query = `
              query($owner: String!, $repo: String!, $issue_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue_number) {
                    trackedInIssues(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;

            let isSubIssue = false;
            let apiError = false;

            try {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });

              const issueData = result.repository.issue;
              
              // An issue tracked in another issue's task list is treated as a sub-issue
              isSubIssue = issueData && issueData.trackedInIssues && issueData.trackedInIssues.totalCount > 0;
            } catch (error) {
              console.log("GraphQL error encountered: ", error);
              // Fail-open: if GraphQL fails, do not force-reopen to avoid locking users out
              isSubIssue = true;
              apiError = true;
            }

            if (!isSubIssue && !apiError) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${sender} Only project admins can close top-level issues. This issue has been automatically moved to **In Review** for sign-off.`
              });
            } else if (apiError) {
              console.log("Closure allowed due to GraphQL error fallback. Check workflow logs for API details.");
            } else {
              console.log("This is a sub-issue. Closure allowed.");
            }